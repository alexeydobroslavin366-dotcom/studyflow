# Workflow автоматической публикации статического сайта на GitHub Pages
name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # позволяет запустить вручную кнопкой в Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг 3. Упаковать файлы сайта в артефакт
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 4. Опубликовать артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
